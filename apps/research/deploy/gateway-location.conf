# Replace the old static /catalysis locations in agent.mattok.cn's HTTPS server.
# Preserve the URI. The existing catalyst relay on port 18771 forwards it to V100.
location = /catalysis { return 308 /catalysis/; }
location ^~ /catalysis/ {
    proxy_pass http://127.0.0.1:18771;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 120s;
}
