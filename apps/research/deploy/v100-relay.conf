# Unprivileged, loopback-only origin for the existing catalyst SSH relay.
pid nginx.pid;
error_log stderr warn;
events {}
http {
    access_log off;
    client_body_temp_path body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;
    server {
        listen 127.0.0.1:8771;
        server_name agent.mattok.cn;
        absolute_redirect off;
        location = /catalysis { return 308 /catalysis/; }
        location ^~ /catalysis/api/worker/ { return 404; }
        location = /catalysis/api/desktop-session { return 404; }
        location ^~ /catalysis/ {
            proxy_pass http://127.0.0.1:8773/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cookie_path / /catalysis/;
            proxy_cache off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
        location / {
            default_type application/json;
            return 410 '{"error":"Legacy catalyst workbench retired","entry":"/catalysis/"}';
        }
    }
}
